<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Email</title>
</head>

<body style="margin:0; padding:0; background-color:#ffffff;">

    <!-- OUTER WRAPPER -->
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
        <tr>
            <td align="center">

                <!-- MAIN CONTAINER -->
                <table width="600" cellpadding="0" cellspacing="0" role="presentation"
                    style="max-width:600px; width:100%; background-color:#ffffff;">

                    <!-- LOGO -->
                    <tr>
                        <td style="padding:30px 20px 10px 20px;">
                            <img src="https://api.wizbizlaonboard.com/uploads/assetes/email-temp-logo.png" width="74"
                                height="85" alt="Wizbizla" style="display:block;">
                        </td>
                    </tr>

                    <!-- TITLE -->
                    <tr>
                        <td style="padding:20px 20px 10px 20px;
                       font-family:Arial, Helvetica, sans-serif;
                       font-size:20px;
                       font-weight:600;
                       color:#00022A;">
                            {{title}}
                        </td>
                    </tr>

                    <!-- GREETING -->
                    <tr>
                        <td style="padding:10px 20px;
                       font-family:Arial, Helvetica, sans-serif;
                       font-size:16px;
                       color:#626884;">
                            Dear {{firstName}},
                        </td>
                    </tr>

                    <!-- BODY CONTENT -->
                    <tr>
                        <td style="padding:0 20px 20px 20px;
                       font-family:Arial, Helvetica, sans-serif;
                       font-size:16px;
                       line-height:24px;
                       color:#626884;">
                            {{body}}
                        </td>
                    </tr>

                    <!-- SIGNATURE -->
                    <tr>
                        <td style="padding:10px 20px;
                       font-family:Arial, Helvetica, sans-serif;
                       font-size:16px;
                       color:#00022A;">
                            Best regards,<br>
                            The Wizbizla Team
                        </td>
                    </tr>
                    <tr>
                        <td
                            style="padding:12px 20px; padding-bottom:12px; font-size:18px; font-weight:500; color:#4F40FF;">

                            Connecting Expats With Trusted Professionals
                        </td>
                    </tr>

                    <!-- FOOTER -->
                    <tr>
                        <td style="padding:30px 20px 10px 20px;">
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <!-- FOOTER LOGO -->
                                    <td align="left">
                                        <img src="https://api.wizbizlaonboard.com/uploads/assetes/email-temp-logo.png"
                                            width="45" height="53" alt="Wizbizla" style="display:block;">
                                    </td>

                                    <!-- SOCIAL ICONS -->
                                    <td align="right">
                                        <a href="https://twitter.com" style="text-decoration:none;">
                                            <img src="https://api.wizbizlaonboard.com/uploads/assetes/twitter.png"
                                                width="20" alt="Twitter">
                                        </a>
                                        &nbsp;&nbsp;
                                        <a href="https://facebook.com" style="text-decoration:none;">
                                            <img src="https://api.wizbizlaonboard.com/uploads/assetes/facebook.png"
                                                width="20" alt="Facebook">
                                        </a>
                                        &nbsp;&nbsp;
                                        <a href="https://instagram.com" style="text-decoration:none;">
                                            <img src="https://api.wizbizlaonboard.com/uploads/assetes/instagram.png"
                                                width="20" alt="Instagram">
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- SPACER -->
                    <tr>
                        <td style="height:20px;"></td>
                    </tr>

                </table>
                <!-- END CONTAINER -->

            </td>
        </tr>
    </table>
    <!-- END WRAPPER -->

</body>

</html>
